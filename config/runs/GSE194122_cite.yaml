# OmicSage — CITE-seq Pipeline Configuration
# Dataset  : GSE194122 BMMC CITE-seq (NeurIPS 2021)
# Modality : CITE-seq (ADT pipeline + RNA+ADT joint integration)
#
# Prerequisites
# -------------
# The RNA pipeline must have been run first:
#   python run_pipeline.py --config config/runs/GSE194122.yaml
# This produces:
#   data/processed/GSE194122/01_qc_adt.h5ad   ← ADT input for this pipeline
#   data/processed/GSE194122/05_annotated.h5ad ← RNA input for integration
#
# Common usage patterns
# ---------------------
# Full pipeline (all 6 steps):
#   python run_cite_pipeline.py --config config/runs/GSE194122_cite.yaml
#
# ADT steps only (no integration):
#   python run_cite_pipeline.py --config config/runs/GSE194122_cite.yaml --to-step annotate_adt
#
# Resume from a step:
#   python run_cite_pipeline.py --config config/runs/GSE194122_cite.yaml --from-step harmony_adt
#
# Run a single step:
#   python run_cite_pipeline.py --config config/runs/GSE194122_cite.yaml --step normalize_adt
#
# Force re-run (ignore cache):
#   python run_cite_pipeline.py --config config/runs/GSE194122_cite.yaml --from-step reduce_adt --force
#
# Step order
# ----------
#   normalize_adt → doublets → reduce_adt → harmony_adt → annotate_adt → integration → deg_cite → gsea_cite
#
# Checkpointed outputs (data/processed/GSE194122/)
# -------------------------------------------------
#   cite_01_normalized_adt.h5ad
#   cite_02_doublets_adt.h5ad
#   cite_03_reduced_adt.h5ad
#   cite_04_harmony_adt.h5ad
#   cite_05_annotated_adt.h5ad
#   cite_06_integration.h5mu   ← MuData (RNA + ADT joint embedding)
#   cite_07_deg.h5mu           ← MuData (DPE + cross-modal RNA DEG in uns)
#   cite_08_gsea.h5mu          ← MuData (GSEA pathway results in uns)

dataset:
  id: GSE194122
  name: "BMMC CITE-seq (NeurIPS 2021)"
  modality: cite
  organism: human

paths:
  # ADT input: produced by the QC step of the RNA pipeline
  adt_input: data/processed/GSE194122/01_qc_adt.h5ad

  # RNA input for integration: annotated RNA from the RNA pipeline
  # Must have:
  #   .X                  = log1p-normalised RNA
  #   layers["counts"]    = raw counts (required for totalVI)
  #   obs["cell_type_vote"] = consensus cell type labels
  rna_input: data/processed/GSE194122/05_annotated.h5ad

  # Where to write checkpointed outputs
  processed_dir: data/processed/GSE194122

  # Where to write HTML reports
  reports_dir: reports/GSE194122

# ── Global CITE-seq settings ──────────────────────────────────────────────────
# batch_key is used by both harmony_adt and integration.
# Override per-step under steps.harmony_adt.params.batch_key
# or steps.integration.params.batch_key if needed.
cite:
  batch_key: batch

# ── Step configuration ────────────────────────────────────────────────────────

steps:

  normalize_adt:
    enabled: true
    params:
      # CLR axis:
      #   0 = per-protein across cells (muon default, Seurat margin=1) ← recommended
      #   1 = per-cell across proteins (Seurat margin=2)
      clr_axis: 0
      dsb_empty_droplets_path: null   # fill in once empty droplets are prepared
      isotype_controls:
        - "Mouse-IgG1"
        - "Mouse-IgG2a"
        - "Mouse-IgG2b"
        - "Rat-IgG2b"

  doublets:
    enabled: true
    params:
      # CLR threshold above which a marker is considered "expressed".
      # 2.5 is the sc-best-practices recommendation for CLR-normalised ADT.
      threshold: 2.5

      # filter_doublets: if true, flagged cells are removed from the AnnData.
      # If false (default), doublets are only flagged in obs["adt_predicted_doublet"]
      # but kept — safer for exploratory runs.
      filter_doublets: false

  reduce_adt:
    enabled: true
    params:
      n_comps: 50       # PCA components to compute
      n_pcs: 20         # PCs used for neighbor graph (sc-best-practices ch.36)
      n_neighbors: 15   # kNN graph k
 
      # Isotype controls to remove before PCA (tutorial recommendation).
      # These carry no biological information after DSB normalization.
      # First run: set to null — inspect protein names in the report,
      # then fill in exact names matching adata.var_names and re-run:
      #   python run_cite_pipeline.py --config ... --step reduce_adt --force
      # For GSE194122 (BioLegend TotalSeq-A Universal Cocktail V1.0):
      isotype_controls: null
      # isotype_controls:
      #   - "Mouse-IgG1"
      #   - "Mouse-IgG2a"
      #   - "Mouse-IgG2b"
      #   - "Rat-IgG2b"
 
      # Colour keys for PCA and UMAP panels — any obs column is valid.
      # Add as many as you want; each gets its own panel in the report.
      # Inspect available obs columns in the report's obs table first.
      umap_color_keys:
        - "batch"
        - "Site"
        # - "n_counts"
        # - "adt_predicted_doublet"

  harmony_adt:
    enabled: true
    params:
      batch_key: batch  # obs column used for Harmony batch correction
      n_pcs: 20         # PCs used after Harmony correction
      n_neighbors: 15
      random_state: 0

  annotate_adt:
    enabled: true
    params:
      # Leiden clustering resolution — lower = fewer, broader clusters.
      # 0.1 is the sc-best-practices default for broad immune cell types.
      # Inspect cite_05_annotated_adt.h5ad and adjust if needed.
      resolution: 0.1
      n_iterations: 2

      # annotation_map: map Leiden cluster IDs → cell type labels.
      # Leave as null on the first run — inspect clusters first, then
      # fill in the map and re-run this step only:
      #   python run_cite_pipeline.py --config ... --step annotate_adt --force
      #
      # Example (fill in after inspecting clusters):
      # annotation_map:
      #   "0": "CD4 T"
      #   "1": "CD8 T"
      #   "2": "B cell"
      #   "3": "NK"
      #   "4": "Monocyte"
      #   "5": "DC"
      # annotation_map derived from dotplot inspection of GSE194122 BMMC clusters.
      # Cluster 3 assigned CD14 Mono — CD11c + CD172a pattern; verify CD41
      # expression if platelet contamination is suspected after DSB.
      # Re-run this step only after changing the map:
      #   python run_cite_pipeline.py --config ... --step annotate_adt --force
      annotation_map: #null
        "0": "Erythroid"    # CD71, CD36, CD88  — largest cluster ~29%
        "1": "Erythroid"    # CD71, CD36, CD33  — second erythroid cluster
        "2": "B"            # CD19, CD72, CD9
        "3": "CD14 Mono"    # CD11c, CD172a     — verify CD41 after DSB
        "4": "CD4 T"        # CD5, CD4, CD45RA
        "5": "CD8 T"        # CD2, CD8, CD3
        "6": "Plasma"       # CD38, CD63, CD54
        "7": "NK"           # CD16, CD45RA, CD56
        "8": "DC"           # CD123, CD162, CD304

      random_state: 0
      preset: "bmmc"

  integration:
    enabled: true
    params:
      # method: "mofa"    — linear, fast, interpretable, no GPU needed
      #         "totalvi" — deep generative model, best benchmark; needs raw counts
      #         "both"    — run MOFA+ then totalVI; scib comparison chart in report
      method: both

      batch_key: batch  # obs column for batch-aware integration

      # MOFA+ parameters (used when method: mofa or both)
      n_factors: 15     # number of latent factors; 15 is a good starting point

      # totalVI parameters (used when method: totalvi or both)
      # Reduce max_epochs for a quick test run (e.g. max_epochs: 10)
      max_epochs: 10

      random_state: 0

      # scib benchmark metrics
      # Requires: pip install scib
      # Computes iLISI, graph_connectivity (batch correction)
      #      and cLISI, ASW_label (bio conservation, needs cell_type_key)
      compute_scib: true
      # cell_type_key: obs column holding cell type labels for scib bio metrics.
      # Use "cell_type_vote" (from RNA pipeline) or "adt_celltype" (from ADT pipeline).
      cell_type_key: cell_type_vote

      # UMAP colour keys for the before/after integration comparison in the report.
      # Any obs column from mdata.obs / mdata["rna"].obs / mdata["adt"].obs is valid.
      # Leave null to auto-detect (batch_key + first available cell type column).
      umap_color_keys:
        - batch
        - cell_type_vote
        # - donor
        # - adt_celltype

  deg_cite:
    enabled: true
    params:
      # obs column on mdata["adt"] used to group cells.
      # Priority: groupby → groupby_fallback → leiden (raw cluster IDs)
      groupby: adt_celltype_manual
      groupby_fallback: adt_celltype_score

      method: wilcoxon
      min_logfc: 0.25
      max_pval_adj: 0.05

      # Top N features to compute per group.
      # 200 effectively means all proteins (panel has 134) and top 200 genes.
      n_genes: 200

      # Protein name prefixes to exclude from DPE results after thresholding.
      # Isotype controls carry no biological signal — always exclude them.
      exclude_protein_prefixes:
        - "Mouse-IgG"
        - "Rat-IgG"

      # Gene name prefixes to exclude from cross-modal RNA DEG results.
      # Uncomment to filter ribosomal / mitochondrial genes from GSEA input.
      exclude_gene_prefixes: []
      # exclude_gene_prefixes:
      #   - "RPL"
      #   - "RPS"
      #   - "MT-"

      # If true, uses mdata["rna"].X directly instead of layers["logcounts"].
      use_raw_rna: false

  gsea_cite:
    enabled: true
    params:
      # Enrichr gene set libraries to query.
      # Leave null to use OmicSage defaults:
      #   GO_Biological_Process_2023, KEGG_2021_Human, Reactome_2022
      gene_sets: null
      # gene_sets:
      #   - "GO_Biological_Process_2023"
      #   - "KEGG_2021_Human"
      #   - "Reactome_2022"

      min_logfc: 0.25
      max_pval_adj: 0.05
      top_n_genes: null   # null = all genes passing filters
      min_genes: 5        # minimum query genes required to run enrichment
      organism: human

      # "up"   — upregulated genes only (recommended for cell-type markers)
      # "down" — downregulated genes only
      # "both" — separate ORA for up and down per group
      direction: up

      # Additional gene prefix exclusions applied before ORA query.
      # These are applied on top of any filtering done in deg_cite.
      exclude_gene_prefixes: []

  protein_rna_corr:
    enabled: true
    params:
      # Correlation method — only "spearman" currently supported.
      # Pearson is not implemented: CLR values are not normally distributed.
      method: spearman

      # Minimum number of cells expressing both protein (CLR > 0) AND
      # the corresponding gene (RNA > 0) for a pair to be tested.
      # Pairs below this threshold are skipped and listed in the report.
      min_cells: 30

      # If true (default), uses mdata["rna"].layers["logcounts"] for RNA.
      # Set false to use mdata["rna"].X directly.
      use_logcounts: true

  epitope_characterisation:
    enabled: true
    params:
      # Cell type grouping column on mdata["adt"].obs
      groupby: adt_celltype_manual
      groupby_fallback: adt_celltype_score

      # Panel source: preset or custom (custom takes precedence if both set)
      # Built-in presets: "bmmc", "pbmc"
      preset: bmmc

      # Custom panels override preset when provided.
      # Keys = panel name, values = list of protein name prefixes.
      # Prefix matching is case-insensitive: "CD3" matches CD3E, CD3D, CD3G.
      # epitope_panels: null
      # epitope_panels:
      #   T_cell:    [CD3, CD5, CD2]
      #   B_cell:    [CD19, CD20, CD22]
      #   Myeloid:   [CD14, CD11c, CD172a]
      #   NK:        [CD56, CD16]
      #   Erythroid: [CD71, CD36]
      epitope_panels: null

      # Number of top DPE markers per cell type in the cross-modal table
      n_top_markers: 5
