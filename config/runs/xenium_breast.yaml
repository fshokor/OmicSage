# xenium_breast.yaml — OmicSage Phase 7 extension (Session B)
# 10x Genomics Xenium — Human Breast Cancer (public dataset)
# https://www.10xgenomics.com/datasets (search "Xenium Breast Cancer")
#
# Download instructions:
#   - Navigate to the dataset page above
#   - Download the "Xenium Output Bundle" folder
#   - Place the unzipped directory at the path below
#
# Key differences from Visium:
#   - Cell-level resolution (not spot-level)
#   - Targeted gene panel (~400-500 genes, not whole transcriptome)
#   - No H&E image loaded by default (DAPI morphology loaded optionally)
#   - No in_tissue flag — all detected cells are included
#   - n_genes range is lower (panel-limited)

dataset_id: xenium_breast
dataset_name: "Xenium Human Breast Cancer"
paths:
  output_dir: data/processed/xenium_breast
  reports_dir: reports/xenium_breast

spatial:
  source: data/benchmark/xenium_breast                  # Xenium output dir
  spatial_type: xenium                                  # explicit — no auto-detect needed
  load_images: false                                    # morphology images not loaded by default

  ingest:
    library_key: null         # single-sample; multi-sample not applicable for Xenium

  qc:
    min_counts: 5             # Xenium targeted panel → lower per-cell count
    max_counts: 5000
    min_genes: 5
    max_genes: 500            # panel-limited; typical max ~400 genes
    max_mt_pct: 30.0          # MT genes often sparse in targeted panels
    mt_prefix: "MT-"
    filter_spots: true        # spots = cells in Xenium context

  reduce:
    n_top_genes: 400          # <= panel size; use all HVGs in targeted panel
    n_comps: 30               # fewer PCs — panel limits effective dimensions
    n_neighbors: 10
    coord_type: null          # auto-detect (generic for cell-level data)
    normalize_total: true
    target_sum: 10000
    log1p: true
    flavor: seurat

  cluster:
    resolution: 0.5
    n_neighbors: 15
    n_pcs: 20
    random_state: 0
    run_svg: true
    svg_n_genes: null         # test all genes
    annotation_map: null

  deconvolve:
    ref_path: null            # Xenium is already cell-level; deconvolve is optional
    method: none              # skip deconvolution for cell-level data by default
    per_sample: false
    library_key: null
    cell_type_key: cell_type
    layer_ref: counts
    n_jobs: 4
    target_sum: 10000

  downstream:
    enabled: true
    run_region_clustering: true
    region_resolution: 0.5
    region_n_neighbors: 15
    run_celltype_expression: false  # disabled until annotation is set
    n_marker_genes: 10
    run_celltype_svg: false
    svg_n_genes: null
    run_co_occurrence: true
    run_nhood_enrichment: true
    n_perms_nhood: 1000
    run_ligrec: true
    ligrec_n_perms: 500       # fewer perms for speed with large cell counts
    ligrec_organism: "human"
    run_svg_gsea: true
    svg_gsea_gene_sets: "GO_Biological_Process_2023"
    svg_gsea_organism: "Human"
    dominant_celltype_key: "dominant_cell_type"
    n_jobs: 4

  impute:
    enabled: false            # Xenium already targeted; imputation less meaningful
    method: tangram
    sc_reference_path: ""
    n_top_genes: 400
    cell_type_key: "cell_type"
    device: cpu
    tangram_mode: clusters
    max_cells_per_type: 500
