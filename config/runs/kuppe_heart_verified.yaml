dataset_id: kuppe_heart_verified
paths:
  output_dir: data/processed/kuppe_heart_verified
  reports_dir: reports/kuppe_heart_verified
spatial:
  source: data/benchmark/kuppe_visium_human_heart_2022_control.h5ad
  spatial_type: h5ad
  load_images: true
  ingest:
    library_key: patient_region_id
  qc:
    min_counts: 500
    max_counts: 100000
    min_genes: 200
    max_genes: 10000
    max_mt_pct: null  # Measure MT%; review tissue-specific cutoff before filtering.
    mt_prefix: MT-
    filter_spots: true
  reduce:
    n_top_genes: 3000
    n_comps: 50
    n_neighbors: 6
    coord_type: null
    normalize_total: true
    target_sum: 10000
    log1p: true
    flavor: seurat
  cluster:
    resolution: 0.5
    n_neighbors: 15
    n_pcs: 30
    random_state: 0
    run_svg: true
    svg_n_genes: 3000
    annotation_map: null
  deconvolve:
    ref_path: data/benchmark/kuppe_snRNA_human_heart_2022_control.h5ad
    method: nnls
    per_sample: true
    library_key: null
    cell_type_key: cell_type_original
    layer_ref: counts
    n_jobs: 4
    target_sum: 10000
    batch_key_ref: donor_id
    batch_key_st: patient
    covariate_keys:
    - assay
    N_cells_per_location: 8
    detection_alpha: 20
    max_epochs_ref: 10
    max_epochs_st: 10
    batch_size_ref: 2000
    batch_size_st: null
    num_samples_posterior: 200
    cell_count_cutoff: 5
    cell_percentage_cutoff2: 0.03
    nonz_mean_cutoff: 1.12
    log_every_n_epochs: 5
  downstream:
    enabled: true
    run_region_clustering: true
    region_resolution: 0.5
    region_n_neighbors: 15
    run_celltype_expression: true
    n_marker_genes: 20
    run_celltype_svg: true
    svg_n_genes: null
    run_co_occurrence: true
    run_nhood_enrichment: true
    n_perms_nhood: 1000
    run_ligrec: true
    ligrec_n_perms: 1000
    ligrec_organism: human
    run_svg_gsea: true
    svg_gsea_gene_sets: GO_Biological_Process_2023
    svg_gsea_organism: Human
    dominant_celltype_key: dominant_cell_type
    n_jobs: 4
  impute:
    enabled: true
    method: tangram
    sc_reference_path: data/benchmark/kuppe_snRNA_human_heart_2022_control.h5ad
    n_top_genes: 2000
    cell_type_key: cell_type_original
    device: cpu
    tangram_mode: clusters
    max_cells_per_type: 500
