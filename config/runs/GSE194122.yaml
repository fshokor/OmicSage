dataset:
  id: GSE194122
  name: BMMC Multiome (NeurIPS 2021)
paths:
  atac_input: data/processed/GSE194122_multiome/01_qc_atac.h5ad
  rna_input: data/processed/GSE194122_multiome/05_annotated.h5ad
  processed_dir: data/processed/BMMC_Multiome_NeurIPS_2021
  reports_dir: reports/BMMC_Multiome_NeurIPS_2021
multiome:
  batch_key: batch
steps:
  atac_qc:
    enabled: true
    params:
      min_peaks: 750
      max_peaks: 500000
      min_peak_counts: 1500
      max_peak_counts: 100000
      max_nucleosome_signal: 2.0
      min_cells: 15
      run_scrublet: false
      filter_cells: false
  atac_reduce:
    enabled: true
    params:
      n_components: 50
      n_neighbors: 15
      leiden_resolution: 0.5
      random_state: 0
      use_raw_counts: true
  atac_annotate:
    enabled: true
    params:
      promoter_upstream_bp: 2000
      rna_label_key: cell_type_vote
      min_peaks_per_gene: 1
      leiden_key: atac_leiden
  multiome_integration:
    enabled: true
    params:
      method: mofa
      batch_key: batch
      n_latent: 20
      max_epochs: 10
      random_state: 0
      n_top_peaks: 20000
  multiome_deg:
    enabled: true
    params:
      groupby: atac_celltype
      method: wilcoxon
      min_logfc: 0.25
      max_pval_adj: 0.05
      n_genes: 200
      exclude_gene_prefixes:
      - MT-
      - RPL
      - RPS
      leiden_fallback: atac_leiden
      exclude_peak_prefixes:
      - chrM
  multiome_grn:
    enabled: true
    params:
      motif_db: jaspar
      groupby: atac_celltype
      n_top_peaks: 500
      min_cells: 10
      random_state: 0
