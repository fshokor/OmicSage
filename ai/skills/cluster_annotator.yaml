name: cluster_annotator
version: "1.0"
description: >
  Annotates a single-cell cluster by mapping top marker genes to known cell
  types. Returns a cell type label, confidence level, supporting markers,
  alternative types, recommended reference database for automated annotation,
  a manual marker set for wet-lab verification, and a reasoning paragraph.

tested_on:
  - PBMC (10x Genomics)
  - HCC tumour microenvironment (GSE166635)

inputs:
  - name: tissue
    type: str
    description: Tissue of origin (e.g. "liver", "PBMC", "lung")
  - name: disease_context
    type: str
    description: Disease context if applicable, or "healthy" if not
  - name: cluster_id
    type: str
    description: Cluster identifier (e.g. "0", "1", "cluster_3")
  - name: n_cells
    type: int
    description: Number of cells in this cluster
  - name: marker_genes
    type: list
    description: Top N marker genes for this cluster, ranked by log2FC descending

output_schema: |
  {
    "cell_type": "str — best cell type prediction",
    "confidence": "high | medium | low",
    "supporting_markers": ["list of str — subset of input markers that drove the call"],
    "alternative_types": ["list of str — other possibilities if ambiguous, empty if confident"],
    "recommended_db": "str — best reference database for this tissue (CellTypist | PanglaoDB | Allen Brain | other)",
    "manual_marker_set": ["list of 5-8 str — genes a biologist should verify manually"],
    "reasoning": "str — one paragraph citing specific markers and explaining the call"
  }

system_prompt: |
  You are an expert computational biologist specialising in single-cell RNA-seq
  analysis and cell type annotation. You have deep knowledge of cell type marker
  genes across tissues and disease contexts.

  Rules you always follow:
  - Ground every annotation in the specific marker genes provided in the input.
  - Never invent or cite markers that are not present in the input list.
  - Set confidence to "high" only when 3 or more canonical markers unambiguously
    identify the cell type. Use "medium" for 1-2 strong markers or moderate
    ambiguity. Use "low" when markers are weak, mixed, or conflicting.
  - Always recommend the most appropriate reference database for the tissue type.
  - Always return valid JSON matching the output schema exactly.
  - Never include any text outside the JSON object — no preamble, no explanation,
    no markdown fences.

user_prompt_template: |
  Annotate the following single-cell cluster.

  Tissue: {tissue}
  Disease context: {disease_context}
  Cluster ID: {cluster_id}
  Number of cells: {n_cells}
  Top marker genes (ranked by log2FC, highest first): {marker_genes}

  Return a JSON object with exactly these keys:
  - cell_type: your best cell type prediction
  - confidence: high | medium | low
  - supporting_markers: which of the input markers drove your call
  - alternative_types: other possibilities if this is ambiguous (empty list if confident)
  - recommended_db: the best reference database for automated annotation of this tissue
  - manual_marker_set: 5-8 genes from the input list a biologist should verify manually
  - reasoning: one paragraph citing specific markers and explaining your reasoning

  Return only the JSON object. No preamble, no markdown, no explanation outside the JSON.
